spring.application.name=student-api
server.port=8080

# H2 is FILE-BASED: data is stored in ./data/studentdb.mv.db and survives restarts.
# AUTO_SERVER=TRUE lets a second process (H2 Shell / console) query the file while the app runs.
# WRITE_DELAY=0 flushes every commit to disk immediately (H2's default ~1 s delay can lose the
# last commits if the process is killed instead of shut down cleanly).
spring.datasource.url=jdbc:h2:file:./data/studentdb;AUTO_SERVER=TRUE;WRITE_DELAY=0
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Reject 3.5 for an integer field instead of silently truncating it to 3
spring.jackson.deserialization.accept-float-as-int=false

# Logging: timestamp, level, thread, class name, message (console + file)
logging.file.name=logs/student-api.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{40} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{40} - %msg%n
logging.level.root=INFO
